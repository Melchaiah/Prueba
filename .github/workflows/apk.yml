# Compila el APK de Android y lo publica como "release" de GitHub para
# descargarlo directo desde el celular.
#
# Se ejecuta con cada push a main o a ramas claude/**, o a mano desde
# la pestaña Actions › "Compilar APK" › Run workflow.
name: Compilar APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Clave de firma (secreto ANDROID_KEYSTORE_BASE64)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_BASE64. El APK se firma con una clave temporal y para actualizarlo habrá que desinstalar la versión anterior."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<PROPS
          storeFile=release.keystore
          storePassword=gastospareja
          keyAlias=gastos
          keyPassword=gastospareja
          PROPS

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }}

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk gastos-pareja.apk
          gh release create "$TAG" gastos-pareja.apk \
            --target "${{ github.sha }}" \
            --title "Gastos Pareja $TAG" \
            --notes "APK compilado desde \`${{ github.ref_name }}\` (${{ github.sha }}). Descargá gastos-pareja.apk e instalalo en el celular." \
            --latest
